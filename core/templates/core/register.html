{% extends 'core/base.html' %}
{% block content %}
<h2>Criar Nova Conta</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Cadastrar</button>
</form>
<p class="mt-3">Já tem uma conta? <a href="{% url 'login' %}">Faça login</a></p>
{% endblock %}
